version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vtuber-postgres
    environment:
      POSTGRES_DB: vtuber_memory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vtuber-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata: